<!-- Filter section -->
<div class="mb-4">
  <label for="statusFilter" class="block mb-1 font-medium text-textDark">Filter by Status</label>
  <select
    id="statusFilter"
    [(ngModel)]="selectedStatus"
    (change)="filterStatus()"
    class="px-3 py-2 border border-gray-300 rounded bg-backgroundLight text-textDark focus:outline-none focus:ring-2 focus:ring-primary"
  >
    <option value="All">All</option>
    <option value="Open">Open</option>
    <option value="In Progress">In Progress</option>
    <option value="Closed">Closed</option>
  </select>
</div>

<!-- Ticket table section -->
<div class="overflow-x-auto rounded-lg shadow">
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-backgroundLight border-b border-gray-200">
      <tr>
        <th class="px-4 py-2 text-left text-xs font-medium text-textDark uppercase">ID</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-textDark uppercase">Subject</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-textDark uppercase">Status</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-textDark uppercase">Created At</th>
      </tr>
    </thead>
    <tbody class="bg-backgroundLight divide-y divide-gray-200">
      <tr *ngFor="let ticket of filteredTickets">
        <td class="px-4 py-2">{{ ticket.id }}</td>
        <td class="px-4 py-2">{{ ticket.subject }}</td>
        <td class="px-4 py-2">
          <span
            class="px-2 py-1 rounded text-sm font-medium"
            [ngClass]="{
              'bg-ticketOpen text-backgroundLight': ticket.status === 'Open',
              'bg-ticketProgress text-backgroundLight': ticket.status === 'In Progress',
              'bg-ticketClosed text-backgroundLight': ticket.status === 'Closed'
            }"
          >
            {{ ticket.status }}
          </span>
        </td>
        <td class="px-4 py-2">{{ ticket.createdAt }}</td>
      </tr>
    </tbody>
  </table>
</div>

<div class="p-4 md:p-8 bg-gray-50 dark:bg-gray-900 min-h-screen">
  
  <div class="flex flex-col md:flex-row gap-6 max-w-7xl mx-auto">

    <div class="flex-1 p-4 bg-white dark:bg-gray-800 shadow-xl rounded-lg border border-gray-200 dark:border-gray-700">
      <h3 class="text-xl font-semibold mb-4 text-gray-800 dark:text-gray-100 border-b pb-2 border-gray-200 dark:border-gray-700">
        Knowledge Editor
      </h3>
      
      <angular-editor 
        [(ngModel)]="editorContent" 
        [config]="config"
        class="block w-full">
      </angular-editor>
    </div>

    <div class="flex-1 p-4 bg-white dark:bg-gray-800 shadow-xl rounded-lg border border-gray-200 dark:border-gray-700">
      <h3 class="text-xl font-semibold mb-4 text-gray-800 dark:text-gray-100 border-b pb-2 border-gray-200 dark:border-gray-700">
        Live Preview
      </h3>
      
      <div 
        class="preview-output h-64 md:h-80 overflow-y-auto p-4 border border-gray-300 dark:border-gray-600 rounded bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200"
        [innerHTML]="editorContent">
      </div>
    </div>
  </div>
</div>
